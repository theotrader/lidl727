<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Zoektool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .search-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .input-row {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            padding-right: 55px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        #micButton {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background-color: #f0f0f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        #micButton svg {
            width: 20px;
            height: 20px;
            fill: #555;
        }
        #micButton:hover {
            background-color: #ddd;
        }
        #micButton.listening {
            background-color: #ff4d4d;
            animation: pulse 1s infinite;
        }
        #micButton.listening svg {
            fill: white;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }
        #micStatus {
            font-size: 14px;
            color: #666;
            min-height: 18px;
            margin-bottom: 8px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            width: 100%;
            box-sizing: border-box;
        }
        li {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        li:hover {
            background-color: #e0e0e0;
        }
        .product-code {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <div class="input-row">
            <input type="text" id="searchInput" placeholder="Typ een productnaam...">
            <button id="micButton" title="Spreek een productnaam in">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-0.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
        </div>
        <div id="micStatus"></div>
        <ul id="suggestions"></ul>
        <div id="productCode" class="product-code"></div>
    </div>

    <script>
        const products = [

            { name: "Vleestomaat", code: "198" },
            { name: "Ananas", code: "4" },
            { name: "Golden Delicious", code: "7" },
            { name: "Elstar", code: "11" },
            { name: "Bananen", code: "12" },
            { name: "Galia meloen", code: "21" },
            { name: "Mango", code: "30" },

            { name: "Kaki", code: "134" },
            { name: "Papaya", code: "152" },
            { name: "Jonagold", code: "237" },

            { name: "Kokosnoot", code: "139" },
            { name: "Kiwi groen", code: "231" },
            { name: "Doyenne du Comice peer", code: "39" },
            { name: "Pink Lady", code: "50" },
            { name: "Granaatappel", code: "349" },
            { name: "Kersen", code: "83" },
            { name: "Cantaloupe meloen", code: "168" },
            { name: "Piel de Sapo meloen", code: "201" },
            { name: "Sinaasappel", code: "71" },
            { name: "Amandelbroodje", code: "89" },
            { name: "Appelflap", code: "268" },
            { name: "Baguette Meergranen Bio", code: "345" },
            { name: "Baguette Wit Bio", code: "344" },
            { name: "Batard Meergranen Bio", code: "340" },
            { name: "Batard Meergranen", code: "303" },
            { name: "Batard Rustiek Wit", code: "301" },

            { name: "Pistolet Rustiek", code: "175" },
            { name: "Kampioentje", code: "324" },
            { name: "Ciabatta", code: "62" },
            { name: "Donut gevuld blauwe bes", code: "277" },
            { name: "Speltbroodje", code: "227" },
            { name: "Gevulde koek", code: "211" },
            { name: "Tijgerbrood wit", code: "153" },
            { name: "Frikandelbroodje", code: "278" },
            { name: "Kaasbroodje Goudse", code: "3" },
            { name: "Pastel de nata", code: "85" },
            { name: "Tijgerbroodje", code: "153" },
            { name: "Zonnebloempitten brood", code: "240" },
            { name: "Pretzel", code: "104" },
            { name: "Oliebol", code: "204" },
            { name: "Walnoten broodje", code: "255" },
            { name: "Pompoenpit broodje", code: "6" },
            { name: "Panini Rustico Meergranen", code: "125" },
            { name: "Volkoren brood", code: "171" },
            { name: "Uienpoeder", code: "0125195" },
            { name: "Uien geel", code: "83327" }
        ];

        const searchInput = document.getElementById('searchInput');
        const suggestionsList = document.getElementById('suggestions');
        const productCodeDisplay = document.getElementById('productCode');

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            suggestionsList.innerHTML = '';
            if (query.length === 0) return;

            const filteredProducts = products.filter(product =>
                product.name.toLowerCase().includes(query)
            );

            filteredProducts.forEach(product => {
                const li = document.createElement('li');
                li.textContent = product.name;
                li.addEventListener('click', () => {
                    searchInput.value = product.name;
                    productCodeDisplay.textContent = `Productcode: ${product.code}`;
                    suggestionsList.innerHTML = '';
                });
                suggestionsList.appendChild(li);
            });
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.toLowerCase();
                const product = products.find(p => p.name.toLowerCase() === query);
                if (product) {
                    productCodeDisplay.textContent = `Productcode: ${product.code}`;
                    suggestionsList.innerHTML = '';
                } else {
                    productCodeDisplay.textContent = 'Product niet gevonden';
                }
            }
        });

        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !suggestionsList.contains(e.target)) {
                suggestionsList.innerHTML = '';
            }
        });

        // Spraakherkenning
        const micButton = document.getElementById('micButton');
        const micStatus = document.getElementById('micStatus');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            micButton.disabled = true;
            micButton.style.opacity = '0.4';
            micButton.title = 'Spraakherkenning wordt niet ondersteund in deze browser';
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'nl-NL';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            let isListening = false;

            micButton.addEventListener('click', () => {
                if (isListening) {
                    recognition.stop();
                    return;
                }
                try {
                    recognition.start();
                } catch (err) {
                    // negeer fout als hij per ongeluk dubbel gestart wordt
                }
            });

            recognition.addEventListener('start', () => {
                isListening = true;
                micButton.classList.add('listening');
                micStatus.textContent = 'Ik luister... spreek een productnaam in';
            });

            recognition.addEventListener('end', () => {
                isListening = false;
                micButton.classList.remove('listening');
            });

            recognition.addEventListener('result', (event) => {
                const spokenText = event.results[0][0].transcript.trim();
                searchInput.value = spokenText;
                micStatus.textContent = `Herkend: "${spokenText}"`;

                // Trigger dezelfde zoeklogica als bij typen
                searchInput.dispatchEvent(new Event('input'));

                // Probeer direct een exacte match te tonen, net als bij Enter
                const query = spokenText.toLowerCase();
                const product = products.find(p => p.name.toLowerCase() === query);
                if (product) {
                    productCodeDisplay.textContent = `Productcode: ${product.code}`;
                    suggestionsList.innerHTML = '';
                }
            });

            recognition.addEventListener('error', (event) => {
                isListening = false;
                micButton.classList.remove('listening');
                if (event.error === 'not-allowed' || event.error === 'permission-denied') {
                    micStatus.textContent = 'Geen toegang tot de microfoon. Sta dit toe in je browserinstellingen.';
                } else if (event.error === 'no-speech') {
                    micStatus.textContent = 'Niks gehoord, probeer het opnieuw.';
                } else {
                    micStatus.textContent = 'Er ging iets mis met spraakherkenning, probeer het opnieuw.';
                }
            });
        }
    </script>
</body>
</html>
